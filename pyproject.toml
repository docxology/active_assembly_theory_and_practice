[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "active_assembly_theory_and_practice"
version = "0.1.0"
description = "Assembly-language analysis as an Active Inference observation pipeline."
readme = "README.md"
authors = [
    {name = "Daniel Ari Friedman", email = "daniel@activeinference.institute"}
]
requires-python = ">=3.11"
dependencies = [
    "capstone>=5.0,<6",
    "defusedxml>=0.7.1",
    "inferactively-pymdp>=1.0.2",
    "matplotlib>=3.7.0",
    "networkx>=3.6.1,<4",
    "numpy>=1.24.0",
    "psutil>=6,<8",
    "pypdf>=6.0,<7",
    "pyyaml>=6.0",
    "unicorn>=2.1,<3",
]

[project.optional-dependencies]
dev = [
    "mypy>=2.4.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.17.0",
    "types-networkx>=3.6.1,<4",
]
heavy = [
    "angr>=9.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]

[tool.setuptools.package-data]
src = ["*.lua"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = ["post_render: requires the current native manuscript export"]

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
precision = 2
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.11"
files = ["src"]
check_untyped_defs = true
warn_unused_ignores = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
# Thin scripts intentionally import after inserting the project root into
# sys.path (the shared orchestration bootstrap), so E402 is scoped out there.
extend-per-file-ignores = { "scripts/*.py" = ["E402"] }

[[tool.mypy.overrides]]
# Third-party modules that ship without type stubs or a py.typed marker.
module = [
    "capstone",
    "capstone.*",
    "defusedxml",
    "defusedxml.*",
    "pymdp",
    "pymdp.*",
    "unicorn",
    "unicorn.*",
    "pypdf",
    "pypdf.*",
    "yaml",
]
ignore_missing_imports = true
