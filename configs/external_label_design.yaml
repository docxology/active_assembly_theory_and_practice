        argument: "Changing strict to non-strict comparison changes the accepted numeric range."
      - id: "scaled_overflow_guard"
        needle: "if (result > maxK) return 1;"
        replacement: "if (result >= maxK) return 1;"
        occurrence: 1
        preconditions: "A K/M-suffixed value reaches the maximum representable scaled threshold."
        argument: "Changing the scaled overflow boundary changes which valid-size inputs are accepted."
      - id: "hex_digit_lower_bound"
        needle: "if (c >= '0' && c <= '9')"
        replacement: "if (c > '0' && c <= '9')"
        preconditions: "The character '0' is converted by the hexadecimal parser."
        argument: "Excluding the lower endpoint misclassifies a valid hexadecimal digit."

  - source_id: "sqlite-v3-45-1"
    source_path: "tool/mkkeywordhash.c"
    function_id: "keywordCompare1/keywordCompare2/keywordCompare3"
    include_dirs: ["."]
    compile_flags: []
    split: "train"
    near_miss:
      - id: "keyword_length_order"
        needle: "int n = pA->len - pB->len;"
        replacement: "int n = pA->len + pB->len;"
        preconditions: "Two keyword records with differing lengths are compared."
        argument: "Replacing subtraction with addition destroys the length ordering contract."
      - id: "suffix_order"
        needle: "int n = pB->longestSuffix - pA->longestSuffix;"
        replacement: "int n = pB->longestSuffix + pA->longestSuffix;"
        preconditions: "Two keyword records with differing suffix lengths are compared."
        argument: "Replacing subtraction with addition changes the suffix-priority ordering."
      - id: "offset_order"
        needle: "int n = pA->offset - pB->offset;"
        replacement: "int n = pA->offset + pB->offset;"
        preconditions: "Two keyword records with differing offsets are compared."
        argument: "Replacing subtraction with addition changes the offset ordering."
      - id: "generator_exit_status"
        needle: "  return 0;"
        replacement: "  return 1;"
        preconditions: "The generated keyword-table program reaches its normal termination path."
        argument: "Changing the normal process status is a source-level control-flow contract near miss."

