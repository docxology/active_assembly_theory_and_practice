  - source_id: "libyaml-v0-2-5"
    source_path: "src/api.c"
    function_id: "yaml_string_extend/yaml_free/yaml_document_get_node"
    include_dirs: ["include", "src", "."]
    compile_flags:
      - "-DYAML_VERSION_STRING=\"0.2.5\""
      - "-DYAML_VERSION_MAJOR=0"
      - "-DYAML_VERSION_MINOR=2"
      - "-DYAML_VERSION_PATCH=5"
    split: "test"
    near_miss:
      - id: "zero_allocation_guard"
        needle: "return malloc(size ? size : 1);"
        replacement: "return malloc(size ? size : 2);"
        preconditions: "A zero-byte allocation request is made through the public allocator wrapper."
        argument: "Changing the zero-size allocation policy changes the allocator contract."
      - id: "string_extend_failure"
        needle: "if (!new_start) return 0;"
        replacement: "if (!new_start) return 1;"
        occurrence: 1
        preconditions: "The first string-buffer extension allocation fails."
        argument: "Changing the failure return changes the documented allocation-failure contract."
      - id: "file_error_polarity"
        needle: "return !ferror(parser->input.file);"
        replacement: "return ferror(parser->input.file);"
        preconditions: "The parser's file input status is queried after a read."
        argument: "Reversing the ferror polarity misreports successful and failed file reads."
      - id: "document_node_count"
        needle: "return document->nodes.top - document->nodes.start;"
        replacement: "return document->nodes.top - document->nodes.start + 1;"
        occurrence: 1
        preconditions: "A document node-count query is made for a populated document."
        argument: "Adding one changes the public node-count contract and can create an off-by-one result."

