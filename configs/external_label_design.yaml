  - source_id: "libpng-v1-6-43"
    source_path: "png.c"
    function_id: "png_check_cHRM_fixed"
    include_dirs: ["."]
    compile_flags: ["-include", "math.h"]
    split: "development"
    near_miss:
      - id: "red_x_bounds"
        needle: "if (xy->redx   < 0 || xy->redx > PNG_FP_1) return 1;"
        replacement: "if (xy->redx   < 0 || xy->redx > PNG_FP_1) return 0;"
        preconditions: "A chromaticity record has a red-x coordinate outside the declared fixed-point interval."
        argument: "Accepting an out-of-range red-x value violates the color-space validation contract."
      - id: "red_y_bounds"
        needle: "if (xy->redy   < 0 || xy->redy > PNG_FP_1-xy->redx) return 1;"
        replacement: "if (xy->redy   < 0 || xy->redy > PNG_FP_1-xy->redx) return 0;"
        preconditions: "A chromaticity record has a red-y coordinate outside its dependent interval."
        argument: "Accepting an out-of-range red-y value violates the dependent-coordinate contract."
      - id: "green_x_bounds"
        needle: "if (xy->greenx < 0 || xy->greenx > PNG_FP_1) return 1;"
        replacement: "if (xy->greenx < 0 || xy->greenx > PNG_FP_1) return 0;"
        preconditions: "A chromaticity record has a green-x coordinate outside the declared interval."
        argument: "Accepting an out-of-range green-x value violates the color-space validation contract."
      - id: "normal_success_status"
        needle: "return 0; /*success*/"
        replacement: "return 1; /*success*/"
        preconditions: "A valid chromaticity record reaches the normal success return."
        argument: "Changing the success return reverses the function's boolean contract."

