schema_version: "1.0.0"
design_id: "active-assembly-source-bound-label-design-v1"
status: "source_bound_mechanical_contracts"
minimum_labelable_examples: 100
equivalent_variants_per_source: 4
negative_controls_per_source: 2
near_miss_variants_per_source: 4

# This file describes how the label-contract producer constructs rows from
# pinned source files.  It is not a list of learned labels.  Equivalent rows
# use comments appended after the source and therefore preserve preprocessing
# tokens; near-miss rows use explicit source-text edits with stated contract
# preconditions; negative controls are byte-identical pairs and are retained as
# non-separating controls.  The producer refuses a missing or multiply matched
# edit, a missing source, a failed static compilation, or a failed Capstone
# decode.
source_designs:
  - source_id: "zlib-v1-3-1"
    source_path: "adler32.c"
    function_id: "adler32_z"
    include_dirs: ["."]
    compile_flags: []
    split: "train"
    near_miss:
      - id: "empty_return_constant"
        needle: "return 1L;"
        replacement: "return 2L;"
        preconditions: "The empty or null-buffer contract path is evaluated; the returned Adler seed must remain 1L."
        argument: "Changing the documented empty-input seed is a source-level contract-breaking near miss."
      - id: "byte_accumulation"
        needle: "adler += *buf++;"
        replacement: "adler += (unsigned char)(*buf++ + 1);"
        occurrence: 1
        preconditions: "The input buffer is non-empty and contains a byte whose checksum contribution is observed."
        argument: "Changing the byte contribution changes the checksum for a valid non-empty input."
      - id: "sum_accumulation"
        needle: "sum2 += adler;"
        replacement: "sum2 += adler + 1;"
        occurrence: 1
        preconditions: "At least one checksum iteration reaches the second-order accumulator."
        argument: "Changing the second-order accumulation changes the returned checksum."
      - id: "modulus_constant"
        needle: "#define BASE 65521U"
        replacement: "#define BASE 65519U"
        preconditions: "An input whose accumulated sums cross the modulus boundary is admitted."
        argument: "The checksum modulus is part of the Adler-32 contract; replacing the prime changes the arithmetic."

