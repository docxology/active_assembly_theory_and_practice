  - source_id: "xxhash-v0-8-2"
    source_path: "cli/xxhsum.c"
    function_id: "XSUM_algoBitmask_Accepts"
    include_dirs: [".", "cli"]
    compile_flags: []
    split: "train"
    near_miss:
      - id: "algorithm_mask_predicate"
        needle: "return (algoBitmask & mask) != 0;"
        replacement: "return (algoBitmask & mask) == 0;"
        preconditions: "A checksum line with an algorithm bit selected by algoBitmask is parsed."
        argument: "Negating the acceptance predicate reverses the source-level algorithm-selection contract."
      - id: "escape_predicate"
        needle: "return *line == '\\\\';"
        replacement: "return *line != '\\\\';"
        preconditions: "A checksum line beginning with a backslash is passed to the unescape detector."
        argument: "Reversing the escape detector changes which filenames are unescaped."
      - id: "line_overflow_guard"
        needle: "if (lineNumber == 0) {"
        replacement: "if (lineNumber != 0) {"
        preconditions: "The checksum-line counter reaches the guard after increment."
        argument: "The predicate change reverses the documented overflow guard."
      - id: "decimal_overflow_guard"
        needle: "if (result > max) return 1;"
        replacement: "if (result >= max) return 1;"
        preconditions: "A decimal value reaches the maximum representable pre-multiplication threshold."
        argument: "Changing strict to non-strict comparison changes the accepted numeric range."

  - source_id: "xxhash-v0-8-1"
    source_path: "cli/xxhsum.c"
    function_id: "charToHex"
    include_dirs: [".", "cli"]
